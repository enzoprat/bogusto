name: APK Bogusto Tickets

# Compile l'app d'impression du terminal Sunmi.
# L'APK est ensuite telechargeable dans l'onglet Actions, depuis le
# navigateur du terminal lui-meme.

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # packages vide : l'action installe sinon un paquet "tools" qui
      # n'existe plus dans le SDK moderne, et echoue dessus. On ne garde
      # que l'acceptation des licences ; le SDK du runner fait le reste.
      - name: SDK Android
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      # Version figee : AGP 8.5 exige Gradle 8.7 ou plus.
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilation
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: APK
        uses: actions/upload-artifact@v4
        with:
          name: bogusto-tickets-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
