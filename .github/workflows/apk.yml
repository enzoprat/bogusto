name: APK Bogusto Tickets

# Compile l'app d'impression du terminal Sunmi.
# L'APK est ensuite telechargeable dans l'onglet Actions, depuis le
# navigateur du terminal lui-meme.

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # packages vide : l'action installe sinon un paquet "tools" qui
      # n'existe plus dans le SDK moderne, et echoue dessus. On ne garde
      # que l'acceptation des licences ; le SDK du runner fait le reste.
      - name: SDK Android
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      # Version figee : AGP 8.5 exige Gradle 8.7 ou plus.
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilation
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: APK en artifact
        uses: actions/upload-artifact@v4
        with:
          name: bogusto-tickets-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Une release publique : contrairement a un artifact, elle se telecharge
      # sans etre connecte a GitHub. Indispensable depuis le navigateur du
      # terminal. L'URL reste la meme d'une version a l'autre :
      #   https://github.com/enzoprat/bogusto/releases/latest/download/app-debug.apk
      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete app --yes --cleanup-tag 2>/dev/null || true
          gh release create app \
            android/app/build/outputs/apk/debug/app-debug.apk \
            --title "Bogusto Tickets - derniere version" \
            --notes "APK d'impression pour le terminal Sunmi V3 PLUS (rouleau 80 mm).\
          Compile depuis le commit ${{ github.sha }}.\
          A installer sur le terminal en autorisant les sources inconnues."
