plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'fr.bogusto.tickets'
    compileSdk 34

    defaultConfig {
        applicationId "fr.bogusto.tickets"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // Bibliotheque officielle de l'imprimante interne Sunmi.
    // Elle detecte le modele toute seule : pas de fichier AIDL par appareil.
    implementation 'com.sunmi:printerlibrary:1.0.24'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
}
